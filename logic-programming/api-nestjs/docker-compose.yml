services:
  api-nestjs:
    build: .
    image: aasc-api-nestjs
    # .env không bắt buộc: mọi biến đều có giá trị mặc định.
    env_file:
      - path: .env
        required: false
    environment:
      # Trong container luôn chạy cổng 3002; cổng ngoài lấy theo PORT.
      PORT: 3002
      DATABASE_PATH: /app/data/tasks.sqlite
      LOG_DIR: /app/logs
    ports:
      - '${PORT:-3002}:3002'
    volumes:
      # Giữ dữ liệu task và log khi tạo lại container.
      - task-data:/app/data
      - task-logs:/app/logs
    restart: unless-stopped

volumes:
  task-data:
  task-logs:
